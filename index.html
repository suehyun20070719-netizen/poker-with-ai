<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Texas Hold'em vs AI</title>
<style>
  :root {
    --bg: #0f0f0f;
    --felt: #0d5c3a;
    --felt-dark: #084229;
    --gold: #e8c547;
    --red: #e74c3c;
    --blue: #3498db;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: #eee;
    min-height: 100vh;
    padding: 8px;
    padding-bottom: 120px;
  }
  h1 {
    text-align: center;
    font-size: 1.15rem;
    color: var(--gold);
    margin: 4px 0 10px;
  }

  /* Controls */
  .top-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin-bottom: 8px;
  }
  .top-bar label { font-size: 0.82rem; color: #aaa; }
  select, button {
    padding: 7px 12px;
    border-radius: 8px;
    border: none;
    font-size: 0.88rem;
    cursor: pointer;
  }
  select { background: #222; color: #fff; }
  button {
    background: var(--gold);
    color: #111;
    font-weight: 700;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: #333; color: #ddd; }
  button.danger { background: var(--red); color: #fff; }
  button.success { background: #27ae60; color: #fff; }
  button.blue { background: var(--blue); color: #fff; }

  .info {
    text-align: center;
    font-size: 0.8rem;
    color: #999;
    margin-bottom: 6px;
  }

  /* ===== TABLE ===== */
  .table-area {
    position: relative;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    background: radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-dark) 75%);
    border: 10px solid #5a3a1c;
    border-radius: 50% / 42%;
    aspect-ratio: 1 / 1.15;
    box-shadow: inset 0 0 50px rgba(0,0,0,0.45);
    overflow: hidden;
  }

  /* Community + Pot */
  .center {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 5;
  }
  .community {
    display: flex;
    gap: 4px;
    justify-content: center;
    min-height: 62px;
    margin-bottom: 6px;
  }
  .pot {
    display: inline-block;
    background: rgba(0,0,0,0.65);
    color: var(--gold);
    font-weight: 800;
    font-size: 0.95rem;
    padding: 4px 14px;
    border-radius: 20px;
  }

  /* Seats */
  .seat {
    position: absolute;
    width: 92px;
    text-align: center;
    z-index: 2;
  }
  .seat .name {
    font-size: 0.72rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 90px;
  }
  .seat .chips {
    font-size: 0.68rem;
    color: #bbb;
  }
  .seat .bet-amount {
    font-size: 0.65rem;
    color: var(--gold);
    min-height: 14px;
  }
  .seat .cards {
    display: flex;
    justify-content: center;
    gap: 2px;
    margin: 2px 0;
    min-height: 48px;
  }
  .seat.folded { opacity: 0.4; }
  .seat.active {
    background: rgba(232,197,71,0.18);
    border-radius: 10px;
    outline: 2px solid var(--gold);
  }
  .seat.dealer .name::after {
    content: " D";
    color: #fff;
    background: #555;
    border-radius: 4px;
    padding: 0 3px;
    font-size: 0.6rem;
  }
  .seat.winner {
    outline: 2px solid #27ae60;
    background: rgba(39,174,96,0.2);
  }

  /* Seat positions (8-max, mobile friendly) */
  .seat[data-i="0"] { bottom: 6px; left: 50%; transform: translateX(-50%); } /* me */
  .seat[data-i="1"] { bottom: 18%; left: 3%; }
  .seat[data-i="2"] { top: 32%; left: 1%; }
  .seat[data-i="3"] { top: 6%; left: 12%; }
  .seat[data-i="4"] { top: 2px; left: 50%; transform: translateX(-50%); }
  .seat[data-i="5"] { top: 6%; right: 12%; }
  .seat[data-i="6"] { top: 32%; right: 1%; }
  .seat[data-i="7"] { bottom: 18%; right: 3%; }

  /* Card */
  .card {
    width: 34px;
    height: 48px;
    background: #fff;
    color: #111;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 0.85rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    line-height: 1.05;
  }
  .card.red { color: #c0392b; }
  .card.back {
    background: linear-gradient(145deg, #1a237e, #0d47a1);
    color: transparent;
  }
  .card .suit { font-size: 0.95rem; }

  /* Action bar - fixed bottom */
  .action-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #1a1a1a;
    border-top: 1px solid #333;
    padding: 10px 8px 16px;
    display: none;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    z-index: 50;
  }
  .action-bar.show { display: flex; }
  .action-bar button { min-width: 70px; padding: 10px 14px; font-size: 0.9rem; }
  .raise-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .raise-wrap input[type=range] { width: 110px; }
  .raise-val { font-size: 0.85rem; color: #ccc; min-width: 36px; }

  /* Log */
  .log {
    max-width: 420px;
    margin: 12px auto 0;
    max-height: 130px;
    overflow-y: auto;
    background: #181818;
    border-radius: 8px;
    padding: 8px;
    font-size: 0.75rem;
    line-height: 1.35;
    color: #bbb;
  }
  .log div { margin-bottom: 1px; }
</style>
</head>
<body>
  <h1>Texas Hold'em vs AI</h1>

  <div class="top-bar">
    <label>인원
      <select id="playerCount">
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8" selected>8</option>
      </select>
    </label>
    <label>난이도
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </label>
    <button id="btnNew" class="success">새 게임</button>
    <button id="btnNext" class="secondary" disabled>다음 핸드</button>
  </div>

  <div class="info">
    <span id="blindInfo">블라인드 5/10</span> · 
    <span id="streetInfo">-</span>
  </div>

  <div class="table-area" id="table">
    <div class="center">
      <div class="community" id="community"></div>
      <div class="pot" id="potDisplay">Pot 0</div>
    </div>
  </div>

  <div class="action-bar" id="actionBar">
    <button id="btnFold" class="danger">폴드</button>
    <button id="btnCheckCall" class="secondary">체크</button>
    <div class="raise-wrap">
      <button id="btnRaise" class="blue">레이즈</button>
      <input type="range" id="raiseSlider" min="20" max="1000" value="40">
      <span class="raise-val" id="raiseVal">40</span>
    </div>
    <button id="btnAllIn" class="danger">올인</button>
  </div>

  <div class="log" id="log"></div>

<script>
/* =========================================================
   Texas Hold'em vs AI - Fixed Version
   - Proper betting round tracking
   - All-in auto runout
   - Mobile-friendly UI
   ========================================================= */

const SUITS = ['♠','♥','♦','♣'];
const RED = new Set(['♥','♦']);
const RANKS = ['2','3','4','5','6','7','8','9','T','J','Q','K','A'];
const RANK_VAL = Object.fromEntries(RANKS.map((r,i)=>[r,i]));

const SB = 5, BB = 10;

let G = null; // game state

// ---------- Helpers ----------
function makeDeck() {
  const d = [];
  for (const s of SUITS) for (const r of RANKS) d.push({r,s});
  return d;
}
function shuffle(a) {
  for (let i=a.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function cardHTML(c, up=true) {
  if (!c) return '';
  if (!up) return `<div class="card back"></div>`;
  const cls = RED.has(c.s) ? 'red' : '';
  return `<div class="card ${cls}"><div>${c.r}</div><div class="suit">${c.s}</div></div>`;
}
function log(msg) {
  const el = document.getElementById('log');
  const d = document.createElement('div');
  d.textContent = msg;
  el.prepend(d);
}

// ---------- Hand Evaluator ----------
function evaluate(cards) {
  if (cards.length < 5) return {rank:-1, value:0, name:'-'};
  const combos = cards.length===5 ? [cards] : combinations(cards,5);
  let best = null;
  for (const five of combos) {
    const e = eval5(five);
    if (!best || e.value > best.value) best = e;
  }
  return best;
}
function combinations(arr, k) {
  const res = [];
  (function rec(start, path) {
    if (path.length===k) { res.push([...path]); return; }
    for (let i=start;i<arr.length;i++) {
      path.push(arr[i]); rec(i+1,path); path.pop();
    }
  })(0,[]);
  return res;
}
function eval5(cards) {
  const vals = cards.map(c=>RANK_VAL[c.r]).sort((a,b)=>b-a);
  const suits = cards.map(c=>c.s);
  const cnt = {};
  vals.forEach(v => cnt[v]=(cnt[v]||0)+1);
  const freq = Object.entries(cnt).map(([v,c])=>({v:+v,c})).sort((a,b)=>b.c-a.c||b.v-a.v);
  const flush = suits.every(s=>s===suits[0]);
  let straight=false, topS=-1;
  const uniq=[...new Set(vals)].sort((a,b)=>b-a);
  for (let i=0;i<=uniq.length-5;i++) {
    if (uniq[i]-uniq[i+4]===4) { straight=true; topS=uniq[i]; break; }
  }
  if (!straight && uniq.includes(12)&&uniq.includes(0)&&uniq.includes(1)&&uniq.includes(2)&&uniq.includes(3)) {
    straight=true; topS=3;
  }
  let rank, name, kickers;
  if (straight && flush) {
    rank = topS===12 ? 9 : 8;
    name = rank===9 ? '로열플러시' : '스티플';
    kickers=[topS];
  } else if (freq[0].c===4) {
    rank=7; name='포카드'; kickers=[freq[0].v,freq[1].v];
  } else if (freq[0].c===3 && freq[1].c===2) {
    rank=6; name='풀하우스'; kickers=[freq[0].v,freq[1].v];
  } else if (flush) {
    rank=5; name='플러시'; kickers=vals;
  } else if (straight) {
    rank=4; name='스트레이트'; kickers=[topS];
  } else if (freq[0].c===3) {
    rank=3; name='트리플'; kickers=[freq[0].v,...freq.slice(1).map(f=>f.v)];
  } else if (freq[0].c===2 && freq[1].c===2) {
    rank=2; name='투페어';
    const ps=[freq[0].v,freq[1].v].sort((a,b)=>b-a);
    kickers=[...ps,freq[2].v];
  } else if (freq[0].c===2) {
    rank=1; name='원페어'; kickers=[freq[0].v,...freq.slice(1).map(f=>f.v)];
  } else {
    rank=0; name='하이카드'; kickers=vals;
  }
  let value = rank * 1e12;
  kickers.forEach((k,i)=> value += k * Math.pow(100,5-i));
  return {rank,value,name,kickers};
}

// ---------- Game Core ----------
function createPlayers(n) {
  const names = ['나','AI-1','AI-2','AI-3','AI-4','AI-5','AI-6','AI-7'];
  return Array.from({length:n}, (_,i)=>({
    id:i, name:names[i], human:i===0,
    chips:1000, hole:[], bet:0, total:0,
    folded:false, allIn:false, acted:false
  }));
}

function startHand() {
  const n = G.players.length;
  G.button = (G.button + 1) % n;
  G.players.forEach(p=>{
    p.hole=[]; p.bet=0; p.total=0;
    p.folded=false; p.allIn=false; p.acted=false;
  });
  G.community=[];
  G.pot=0;
  G.deck=shuffle(makeDeck());
  G.street='preflop';
  G.currentBet=0;
  G.minRaise=BB;
  G.handOver=false;
  G.actedThisRound=0;

  // blinds
  const sb = (G.button+1)%n;
  const bb = (G.button+2)%n;
  post(G.players[sb], SB);
  post(G.players[bb], BB);
  G.currentBet = BB;

  // deal
  for (let r=0;r<2;r++) {
    for (const p of G.players) {
      if (p.chips>0 || p.total>0) p.hole.push(G.deck.pop());
    }
  }

  // first actor = left of BB
  G.toAct = (bb+1)%n;
  skipInvalid();
  log(`—— 새 핸드 (버튼 ${G.players[G.button].name}) ——`);
  render();
  scheduleAI();
}

function post(p, amt) {
  const pay = Math.min(amt, p.chips);
  p.chips -= pay;
  p.bet += pay;
  p.total += pay;
  G.pot += pay;
  if (p.chips===0) p.allIn=true;
}

function skipInvalid() {
  let guard=0;
  while (guard < G.players.length) {
    const p = G.players[G.toAct];
    if (!p.folded && !p.allIn && p.chips>0) return;
    G.toAct = (G.toAct+1)%G.players.length;
    guard++;
  }
}

function living() { return G.players.filter(p=>!p.folded); }
function canAct() { return G.players.filter(p=>!p.folded && !p.allIn && p.chips>0); }

function doAction(pid, type, raiseTo=0) {
  if (G.handOver) return;
  const p = G.players[pid];
  if (pid !== G.toAct || p.folded || p.allIn) return;

  const toCall = G.currentBet - p.bet;

  if (type==='fold') {
    p.folded=true;
    log(`${p.name} 폴드`);
  } else if (type==='check' || type==='call') {
    if (toCall===0) {
      log(`${p.name} 체크`);
    } else {
      const pay = Math.min(toCall, p.chips);
      p.chips-=pay; p.bet+=pay; p.total+=pay; G.pot+=pay;
      if (p.chips===0) p.allIn=true;
      log(`${p.name} 콜 ${pay}`);
    }
  } else if (type==='raise' || type==='allin') {
    let target = (type==='allin') ? p.bet + p.chips : raiseTo;
    target = Math.max(target, G.currentBet + G.minRaise);
    target = Math.min(target, p.bet + p.chips);
    const pay = target - p.bet;
    if (pay<=0 && type!=='allin') return;
    p.chips-=pay; p.bet+=pay; p.total+=pay; G.pot+=pay;
    if (p.bet > G.currentBet) {
      G.minRaise = Math.max(G.minRaise, p.bet - G.currentBet);
      G.currentBet = p.bet;
      // reset acted flags for others
      G.players.forEach(x=>{ if (x!==p && !x.folded && !x.allIn) x.acted=false; });
    }
    if (p.chips===0) p.allIn=true;
    log(`${p.name} ${p.allIn?'올인':'레이즈'} → ${p.bet}`);
  }

  p.acted = true;

  // next
  G.toAct = (G.toAct+1)%G.players.length;
  skipInvalid();

  // check round end
  if (roundDone()) {
    advanceStreet();
  } else {
    render();
    scheduleAI();
  }
}

function roundDone() {
  const actors = canAct();
  if (actors.length===0) return true; // all all-in or folded
  // everyone who can still act has matched the bet and has acted
  return actors.every(p => p.bet===G.currentBet && p.acted);
}

function advanceStreet() {
  // reset street bets
  G.players.forEach(p=>{ p.bet=0; p.acted=false; });
  G.currentBet=0;
  G.minRaise=BB;

  const alive = living();
  if (alive.length<=1) {
    finish(alive[0] || null);
    return;
  }

  // if no one can act anymore → run out board
  if (canAct().length===0) {
    while (G.community.length<5) {
      G.community.push(G.deck.pop());
    }
    G.street='river';
    showdown();
    return;
  }

  if (G.street==='preflop') {
    G.street='flop';
    G.community.push(G.deck.pop(),G.deck.pop(),G.deck.pop());
    log('▶ 플랍  ' + G.community.map(c=>c.r+c.s).join(' '));
  } else if (G.street==='flop') {
    G.street='turn';
    G.community.push(G.deck.pop());
    log('▶ 턴  ' + G.community[3].r+G.community[3].s);
  } else if (G.street==='turn') {
    G.street='river';
    G.community.push(G.deck.pop());
    log('▶ 리버  ' + G.community[4].r+G.community[4].s);
  } else {
    showdown();
    return;
  }

  // first to act = left of button
  G.toAct = (G.button+1)%G.players.length;
  skipInvalid();
  render();
  scheduleAI();
}

function showdown() {
  const contenders = living();
  const scored = contenders.map(p=>{
    const e = evaluate([...p.hole, ...G.community]);
    return {p, e};
  });
  scored.sort((a,b)=>b.e.value-a.e.value);
  const best = scored[0].e.value;
  const winners = scored.filter(s=>s.e.value===best).map(s=>s.p);
  const share = Math.floor(G.pot / winners.length);
  winners.forEach(w=>{
    w.chips += share;
    const nm = scored.find(s=>s.p===w).e.name;
    log(`★ ${w.name} 승! ${nm} (+${share})`);
  });
  G.pot=0;
  G.handOver=true;
  render(true);
  document.getElementById('btnNext').disabled=false;
  document.getElementById('actionBar').classList.remove('show');
}

function finish(winner) {
  if (winner) {
    winner.chips += G.pot;
    log(`★ ${winner.name} 승 (나머지 폴드) +${G.pot}`);
  }
  G.pot=0;
  G.handOver=true;
  render(true);
  document.getElementById('btnNext').disabled=false;
  document.getElementById('actionBar').classList.remove('show');
}

// ---------- AI ----------
function scheduleAI() {
  if (G.handOver) return;
  const p = G.players[G.toAct];
  if (!p || p.human || p.folded || p.allIn) return;
  setTimeout(()=>{
    if (G.handOver) return;
    const d = aiThink(p);
    doAction(p.id, d.type, d.raiseTo);
  }, 380 + Math.random()*320);
}

function aiThink(p) {
  const diff = G.difficulty;
  const toCall = G.currentBet - p.bet;
  const pot = G.pot;
  let str = 0;
  if (G.street==='preflop') str = preStr(p.hole);
  else {
    const e = evaluate([...p.hole,...G.community]);
    str = (e.rank+1)/10 + (Math.random()*0.08-0.04);
  }

  let foldT, raiseT, bluff;
  if (diff==='easy')   { foldT=0.22; raiseT=0.68; bluff=0.07; }
  else if (diff==='medium'){ foldT=0.34; raiseT=0.55; bluff=0.14; }
  else                 { foldT=0.42; raiseT=0.48; bluff=0.20; }

  str += (Math.random()-0.5)*(diff==='easy'?0.22:diff==='medium'?0.11:0.05);

  if (toCall===0) {
    if (str>raiseT || Math.random()<bluff*0.6) {
      const sz = Math.min(p.chips, Math.floor(pot*(0.45+Math.random()*0.7)));
      return {type:'raise', raiseTo: p.bet + Math.max(G.minRaise, sz)};
    }
    return {type:'check'};
  }
  if (str < foldT && Math.random()>bluff) return {type:'fold'};
  if (str > raiseT+0.08 || (str>0.48 && Math.random()<bluff)) {
    const sz = Math.min(p.chips, Math.floor((toCall+pot)*(0.55+Math.random()*0.7)));
    return {type:'raise', raiseTo: p.bet + toCall + Math.max(G.minRaise, sz)};
  }
  if (str > toCall/(pot+toCall+1)*0.85 || str>0.36) return {type:'call'};
  return {type:'fold'};
}

function preStr(hole) {
  const v1=RANK_VAL[hole[0].r], v2=RANK_VAL[hole[1].r];
  const hi=Math.max(v1,v2), lo=Math.min(v1,v2);
  let s=hi;
  if (v1===v2) s*=1.85;
  else {
    if (hole[0].s===hole[1].s) s+=2.2;
    const gap=hi-lo;
    if (gap===1) s+=1.2;
    else if (gap===2) s+=0.5;
    else if (gap>3) s-=gap*0.35;
  }
  return Math.min(1, Math.max(0,(s-3.5)/18));
}

// ---------- Render ----------
function render(reveal=false) {
  const table = document.getElementById('table');
  table.querySelectorAll('.seat').forEach(s=>s.remove());

  G.players.forEach((p,i)=>{
    const seat = document.createElement('div');
    seat.className = 'seat';
    seat.dataset.i = i;
    if (p.folded) seat.classList.add('folded');
    if (!G.handOver && G.toAct===p.id) seat.classList.add('active');
    if (p.id===G.button) seat.classList.add('dealer');

    const show = p.human || reveal || G.handOver;
    seat.innerHTML = `
      <div class="name">${p.name}${p.allIn?' (올인)':''}</div>
      <div class="chips">${p.chips}</div>
      <div class="cards">${p.hole.map(c=>cardHTML(c,show)).join('')}</div>
      <div class="bet-amount">${p.bet>0?p.bet:''}</div>
    `;
    table.appendChild(seat);
  });

  document.getElementById('community').innerHTML =
    G.community.map(c=>cardHTML(c,true)).join('');
  document.getElementById('potDisplay').textContent = `Pot ${G.pot}`;
  document.getElementById('streetInfo').textContent = G.handOver ? '핸드 종료' : G.street;

  // action bar
  const bar = document.getElementById('actionBar');
  const me = G.players[0];
  if (!G.handOver && G.toAct===0 && !me.folded && !me.allIn && me.chips>0) {
    bar.classList.add('show');
    const toCall = G.currentBet - me.bet;
    const btn = document.getElementById('btnCheckCall');
    btn.textContent = toCall===0 ? '체크' : `콜 ${toCall}`;

    const minR = Math.max(G.currentBet + G.minRaise, me.bet + G.minRaise);
    const maxR = me.bet + me.chips;
    const slider = document.getElementById('raiseSlider');
    slider.min = minR;
    slider.max = Math.max(minR, maxR);
    slider.value = Math.min(maxR, Math.max(minR, Math.floor(G.currentBet*2.2)||minR));
    document.getElementById('raiseVal').textContent = slider.value;
  } else {
    bar.classList.remove('show');
  }
}

// ---------- Events ----------
document.getElementById('btnNew').onclick = ()=>{
  const n = +document.getElementById('playerCount').value;
  const diff = document.getElementById('difficulty').value;
  G = {
    players: createPlayers(n),
    button: n-1,
    difficulty: diff,
    pot:0, community:[], street:'preflop',
    deck:[], currentBet:0, minRaise:BB,
    toAct:0, handOver:false
  };
  document.getElementById('log').innerHTML='';
  document.getElementById('btnNext').disabled=true;
  startHand();
};

document.getElementById('btnNext').onclick = ()=>{
  G.players = G.players.filter(p=>p.chips>0 || p.human);
  if (G.players.length<2) {
    log('게임 종료');
    return;
  }
  G.players.forEach((p,i)=>{ p.id=i; });
  document.getElementById('btnNext').disabled=true;
  startHand();
};

document.getElementById('btnFold').onclick = ()=> doAction(0,'fold');
document.getElementById('btnCheckCall').onclick = ()=>{
  const toCall = G.currentBet - G.players[0].bet;
  doAction(0, toCall===0?'check':'call');
};
document.getElementById('btnRaise').onclick = ()=>{
  doAction(0,'raise', +document.getElementById('raiseSlider').value);
};
document.getElementById('btnAllIn').onclick = ()=> doAction(0,'allin');
document.getElementById('raiseSlider').oninput = e=>{
  document.getElementById('raiseVal').textContent = e.target.value;
};

// auto start
document.getElementById('btnNew').click();
</script>
</body>
</html>
